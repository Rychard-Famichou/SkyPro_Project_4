{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm text-center">
        <div class="card-body p-5">
            <!-- Зеленая иконка успеха -->
            <div class="mb-4 text-success">
                <svg xmlns="http://w3.org" width="64" height="64" fill="currentColor" class="bi bi-shield-check" viewBox="0 0 16 16">
                    <path d="M5.338 1.59a61.44 61.44 0 0 0-2.837.856.481.481 0 0 0-.328.39c-.554 4.157.726 7.19 2.253 9.188a10.725 10.725 0 0 0 2.287 2.233.46.46 0 0 0 .574-.002 10.725 10.725 0 0 0 2.287-2.233c1.527-1.997 2.807-5.031 2.253-9.188a.48.48 0 0 0-.328-.39c-.656-.213-1.601-.486-2.837-.855a.42.42 0 0 0-.256 0a61.4 61.4 0 0 0-2.838.856zM8 0c-.69 0-1.38.15-2.05.41a62.4 62.4 0 0 0-3.34 1.015c-.565.17-.83.76-.69 1.33.62 4.67-.85 8.11 1.7 10.4a11.7 11.7 0 0 0 2.93 2.5c.31.18.69.18 1 0a11.7 11.7 0 0 0 2.93-2.5c2.55-2.29 1.08-5.73 1.7-10.4.14-.57-.125-1.16-.69-1.33A62.4 62.4 0 0 0 10.05.41C9.38.15 8.69 0 8 0z"/>
                    <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
                </svg>
            </div>
            
            <h2 class="card-title mb-3">Пароль успешно изменён</h2>
            
            <p class="card-text text-muted fs-5 mb-4">
                Ваш новый пароль был успешно сохранён. Теперь вы можете войти в свой аккаунт, используя новые данные.
            </p>
            
            <hr class="my-4">
            
            <a href="{% url 'account_login' %}" class="btn btn-success btn-lg w-100">
                Войти в аккаунт
            </a>
        </div>
    </div>
</div>
{% endblock %}
