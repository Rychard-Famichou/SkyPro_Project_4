{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm"> <!-- Добавлена аккуратная карточка -->
        <h2>Выход из аккаунта</h2>
        <p class="text-muted small mb-4">Вы уверены, что хотите выйти из своего профиля?</p>

        <form method="POST" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {{ form|crispy }}

            <button type="submit" class="btn btn-danger w-100 mb-2">Да, выйти</button>
            <a href="{% url 'home' %}" class="btn btn-light w-100 text-decoration-none">Остаться на сайте</a>
        </form>
    </div>
</div>

{% endblock %}
