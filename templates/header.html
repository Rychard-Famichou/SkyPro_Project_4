<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <div class="d-flex flex-column flex-md-row align-items-center justify-content-center gap-3">
        <h1 class="display-5 mb-0">{{ header_title }}</h1>
        {% if header_button %}
        <a href="{{ header_url }}" class="btn btn-outline-primary btn-lg">{{ header_button }}</a>
        {% endif %}
    </div>
    {% if header_lead %}
    <p class="lead mt-3">{{ header_lead }}</p>
    {% endif %}
</div>
